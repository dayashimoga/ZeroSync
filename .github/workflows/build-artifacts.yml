name: AirDrop-QR / ZeroSync CI & Multi-Platform Artifacts

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: STATIC ANALYSIS, LINTING, AIR-GAP AUDIT & COVERAGE GATES
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Code Quality, Air-Gap Audit & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Opt-out of Flutter Analytics
        run: flutter config --no-analytics

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Enforce Code Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ tool/

      - name: Enforce Zero-Warning Static Analysis
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Air-Gap AST & Clean Architecture Boundary Linter
        run: dart run tool/verify_airgap.dart

      - name: Zero-Trust Air-Gap Manifest Audit
        run: |
          echo ">>> Auditing Android & iOS manifests for zero network scopes..."
          VIOLATIONS=0
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            if grep -i -E "android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE" android/app/src/main/AndroidManifest.xml; then
              echo "::error::Network permission detected in AndroidManifest.xml!"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          fi
          if [ -f "ios/Runner/Info.plist" ]; then
            if grep -i -E "NSAllowsArbitraryLoads.*true" ios/Runner/Info.plist; then
              echo "::error::Insecure network transport detected in Info.plist!"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          fi
          if [ $VIOLATIONS -ne 0 ]; then
            echo "Zero-Trust Air-Gap Policy Violated. Build aborted."
            exit 1
          fi
          echo "Air-gap zero-network security audit passed."

      - name: Execute Domain & Unit Test Suite with Coverage
        run: |
          if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
            flutter test --coverage
          else
            echo "Skipping test execution: No test files present."
          fi

      - name: Check Domain Line Coverage Gate (>= 85%)
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file found. Calculating domain layer line coverage..."
            TOTAL_LINES=$(grep -c "^DA:" coverage/lcov.info || true)
            HIT_LINES=$(grep -c "^DA:.*,[1-9][0-9]*" coverage/lcov.info || true)
            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE_PCT=$(awk -v hit="$HIT_LINES" -v tot="$TOTAL_LINES" 'BEGIN { printf "%.2f", (hit/tot)*100 }')
              echo "Measured Domain Line Coverage: $COVERAGE_PCT%"
              IS_PASS=$(awk -v cov="$COVERAGE_PCT" 'BEGIN { print (cov >= 85.0) ? "PASS" : "FAIL" }')
              if [ "$IS_PASS" != "PASS" ]; then
                echo "::error::Domain coverage ($COVERAGE_PCT%) below required 85.0% threshold."
                exit 1
              fi
            fi
          fi

  # ---------------------------------------------------------------------------
  # JOB 2: ANDROID HERMETIC BUILD MATRIX (SPLIT APKS & AAB)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (${{ matrix.target }})
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - split-apk
          - app-bundle

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Opt-out of Flutter Analytics
        run: flutter config --no-analytics

      - name: Cache Gradle Caches & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject flutter.sdk Path
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Build Android Split per-ABI APKs
        if: matrix.target == 'split-apk'
        run: |
          flutter build apk --split-per-abi --release --no-tree-shake-icons
          mkdir -p output-android-apk
          cp build/app/outputs/flutter-apk/app-*.apk output-android-apk/
          cd output-android-apk
          sha256sum app-*.apk > CHECKSUMS_APK.sha256
          cat CHECKSUMS_APK.sha256

      - name: Build Android App Bundle (AAB)
        if: matrix.target == 'app-bundle'
        run: |
          flutter build appbundle --release --no-tree-shake-icons
          mkdir -p output-android-aab
          cp build/app/outputs/bundle/release/app-release.aab output-android-aab/
          cd output-android-aab
          sha256sum app-release.aab > CHECKSUMS_AAB.sha256
          cat CHECKSUMS_AAB.sha256

      - name: Upload Android Split APK Artifacts
        if: matrix.target == 'split-apk'
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-qr-android-split-apks
          path: output-android-apk/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Android Bundle Artifact
        if: matrix.target == 'app-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-qr-android-aab
          path: output-android-aab/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 3: IOS HERMETIC BUILD & UNSIGNED IPA PACKAGING
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (Unsigned Release IPA)
    needs: lint-and-test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Opt-out of Flutter Analytics
        run: flutter config --no-analytics

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA Archive
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r -9 ../../../ZeroSync-iOS-unsigned.ipa Payload
          cd ../../..
          mkdir -p output-ios
          mv ZeroSync-iOS-unsigned.ipa output-ios/
          cd output-ios
          shasum -a 256 ZeroSync-iOS-unsigned.ipa > CHECKSUMS_IOS.sha256
          cat CHECKSUMS_IOS.sha256

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-qr-ios-unsigned-ipa
          path: output-ios/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 4: WINDOWS HERMETIC BUILD & RELEASE ZIP PACKAGING
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (Release x64 ZIP)
    needs: lint-and-test
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Opt-out of Flutter Analytics
        run: flutter config --no-analytics

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows ZIP Archive & Compute SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output-windows
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath output-windows/ZeroSync-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path output-windows/ZeroSync-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ZeroSync-Windows-x64.zip" | Out-File -FilePath output-windows/CHECKSUMS_WINDOWS.sha256 -Encoding ascii
          Get-Content output-windows/CHECKSUMS_WINDOWS.sha256

      - name: Upload Windows x64 ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-qr-windows-x64-zip
          path: output-windows/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 5: UNIFIED MULTIPLATFORM GITHUB RELEASE PUBLISHING
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform Release Matrix
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android Split APKs
        uses: actions/download-artifact@v4
        with:
          name: airdrop-qr-android-split-apks
          path: release-assets/android-apk/

      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: airdrop-qr-android-aab
          path: release-assets/android-aab/

      - name: Download iOS Unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: airdrop-qr-ios-unsigned-ipa
          path: release-assets/ios/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: airdrop-qr-windows-x64-zip
          path: release-assets/windows/

      - name: Consolidate Binaries & Generate Master Checksums
        run: |
          mkdir -p release-dist
          find release-assets -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

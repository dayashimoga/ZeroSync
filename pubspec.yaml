name: airdrop_qr
description: "ZeroSync: Air-Gapped Optical Data Transfer and High-Speed QR Hub for Flutter"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Presentation & Reactive State Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  meta: ^1.12.0

  # Optical Engines & Serialization
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  archive: ^3.6.1
  uuid: ^4.4.0
  crypto: ^3.0.8

  # Cryptographic Storage & Air-Gap Vault
  sqflite_sqlcipher: 3.2.0
  flutter_secure_storage: ^9.2.2
  ffi: ^2.1.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/

